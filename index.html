<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is a Contact Form">
        <title>Contact Form</title>
    </head>
    <body>
        <header>
            <h1>Acme Support</h1>
            <nav>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </nav>
        </header>
        <hr>    
        <main>
            <h2>Contact Us</h2>
            <p>Send us a message and we will get back to you</p>
            <form action="https://example.com/submit" method="post">
                <label for="full-name">Full Name:</label>
                <input type="text" name="full-name" id="full-name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
                <br><br>

                <label for="subject">Subject:</label>
                <select id="subject" name="subject">
                    <option value="">Choose a topic</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                </select>
                <br><br>

                <label for="message">Message:</label>
                <textarea name="message" id="message" cols="30" rows="10" minlength="10" required></textarea>
                <br><br>

                <fieldset>
                    <legend>How did you hear about us?</legend>

                    <input type="radio" id="search" name="hear" value="search">
                    <label for="search">Search</label>
                    
                    <input type="radio" id="friend" name="hear" value="friend">
                    <label for="friend">Friend</label>
                    
                    <input type="radio" id="social-media" name="hear" value="social-media">
                    <label for="social-media">Social Media</label>
                    
                </fieldset>

                <input type="checkbox" id="product-update" name="product-update" value="yes">
                <label for="product-update">Send me product updates</label>
                <br><br>

                <button type="submit">Send Message</button>
            </form>
            <hr>
        </main>
        <footer>
            <p>&copy; 2026 Acme Support</p>
        </footer>
    </body>
</html>
